<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>押してはいけないボタン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #F4F1EA;     /* 実験室の白 */
    --main: #E5312B;     /* 赤いボタン */
    --main-ink: #FFFFFF;
    --accent: #1E2A3A;   /* 警告の濃紺 */
    --main-l: #FBD5D2;
    --field: #FFFFFF;
    --ink: #1E2A3A;
    --ink-2: #6B7480;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--base); color: var(--ink); font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; user-select: none; transition: background .35s; }
  body.dark { background: #2A2F38; color: #fff; }
  .app { position: relative; max-width: 480px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding: 18px; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 14px; color: var(--ink-2); }
  body.dark .top { color: #C9CFD8; }
  .mute { border: 0; background: rgba(0,0,0,.06); color: inherit; border-radius: 999px; width: 36px; height: 36px; font-size: 16px; }
  .msg { margin-top: 9vh; text-align: center; font-size: clamp(34px, 10vw, 48px); font-weight: 900; line-height: 1.15; min-height: 2.4em; }
  .sub { text-align: center; font-size: 16px; color: var(--ink-2); min-height: 1.4em; }
  body.dark .sub { color: #C9CFD8; }
  .field { position: relative; flex: 1; width: 100%; }
  .btn-red {
    position: absolute; left: 50%; top: 42%; width: min(62vw, 260px); aspect-ratio: 1; border-radius: 50%; border: 0;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #FF7A72, var(--main) 55%, #A8150F);
    box-shadow: 0 14px 0 #8E120D, 0 24px 40px rgba(0,0,0,.25);
    color: #fff; font: inherit; font-size: clamp(22px, 6.5vw, 30px); font-weight: 900; letter-spacing: .05em;
    transition: left .28s cubic-bezier(.3,1.5,.5,1), top .28s cubic-bezier(.3,1.5,.5,1), transform .1s;
  }
  .btn-red:active { transform: translate(-50%, -46%); box-shadow: 0 6px 0 #8E120D, 0 12px 20px rgba(0,0,0,.25); }
  .btn-red.small { width: min(34vw, 140px); font-size: 18px; }
  .wobble { animation: wobble 1.2s ease-in-out infinite; }
  .shake { animation: shake .25s linear infinite; }
  .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46vw; font-weight: 900; color: var(--main); pointer-events: none; animation: pop .35s; }
  .stats { text-align: center; font-size: 15px; color: var(--ink-2); margin-bottom: 10px; }
  body.dark .stats { color: #C9CFD8; }
  .stats b { font-size: 22px; color: inherit; }
  .confetti { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; pointer-events: none; }
  .note { font-size: 11px; color: var(--ink-2); text-align: center; }
  @keyframes wobble { 0%,100% { transform: translate(-50%,-50%) rotate(0); } 25% { transform: translate(-50%,-50%) rotate(-2deg); } 75% { transform: translate(-50%,-50%) rotate(2deg); } }
  @keyframes shake { 0%,100% { transform: translate(-50%,-50%); } 25% { transform: translate(-52%,-50%); } 75% { transform: translate(-48%,-50%); } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .wobble, .shake { animation: none; } .confetti { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span id="round">押した回数 0</span><button class="mute" id="mute">🔊</button></div>
  <div class="msg" id="msg">押さないで</div>
  <div class="sub" id="sub">このボタン、絶対に押さないで。</div>
  <div class="field" id="field"><button class="btn-red wobble" id="red">押さないで</button></div>
  <div class="stats" id="stats"></div>
  <div class="note">押しても本当に何も起きません。</div>
</div>
<script>
/*
 * 押してはいけないボタン
 * 押すたびに、警告 → 暗転 → 逃げるボタン（捕まえる）→ 3・2・1 → 紙吹雪「何も起きません」→ 最初の画面 に戻る。
 * 2周目からは画面が逆さまになる場面が入る。最後の画面は最初の画面と同じ（ループ）。
 * 押した回数と、逃げるボタンを捕まえるまでの最速タイムを、ジサップの保存機能で残す。
 */
const $ = id => document.getElementById(id);
const red = $('red'), msg = $('msg'), sub = $('sub'), field = $('field');
let step = 0, presses = 0, laps = 0, best = null, escapeTimer = null, escapeStart = 0, busy = false, muted = false;

const store = {
  async load() { try { return window.Jisapp ? await window.Jisapp.loadData('dontpress') : null; } catch { return null; } },
  async save() { try { if (window.Jisapp) await window.Jisapp.saveData('dontpress', { presses, best, laps }); } catch {} },
};

// 効果音：同じ決定音をくり返してリズムを作る（警告音は小さめ）
let ctx = null;
function tone(f, d = .08, type = 'square', v = .08, delay = 0) {
  if (muted) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const click = () => tone(700, .06, 'triangle', .16);
const warn = () => { tone(330, .18, 'sawtooth', .05); tone(330, .18, 'sawtooth', .05, .22); };
const boop = () => tone(520, .09, 'sine', .14);
const tada = () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .14, 'triangle', .14, i * .09));

function say(m, s = '') { msg.textContent = m; sub.textContent = s; }
function stats() { $('round').textContent = `押した回数 ${presses}`; $('stats').innerHTML = best ? `捕まえる最速 <b>${(best / 1000).toFixed(2)}</b> 秒` : ''; }

function reset() {
  // 最初の画面（ループの最後もここに戻る）
  step = 0; busy = false; clearInterval(escapeTimer);
  document.body.classList.remove('dark'); document.querySelector('.app').style.transform = '';
  red.className = 'btn-red wobble'; red.style.left = ''; red.style.top = ''; red.textContent = '押さないで'; red.style.visibility = '';
  say('押さないで', 'このボタン、絶対に押さないで。'); stats();
}

function moveRandom() {
  const w = field.clientWidth, h = field.clientHeight, s = red.offsetWidth / 2 + 10;
  red.style.left = (s + Math.random() * Math.max(1, w - 2 * s)) + 'px';
  red.style.top = (s + Math.random() * Math.max(1, h - 2 * s)) + 'px';
  boop();
}

function countdown(done) {
  red.style.visibility = 'hidden'; say('捕まえると……', '');
  let n = 3;
  const show = () => {
    field.querySelectorAll('.count').forEach(e => e.remove());
    if (n === 0) { done(); return; }
    const c = document.createElement('div'); c.className = 'count'; c.textContent = n; field.appendChild(c); tone(440 + (3 - n) * 120, .12, 'sine', .14);
    n--; setTimeout(show, 900);
  };
  show();
}

function confetti() {
  const colors = ['#E5312B', '#F59E0B', '#2D7FF9', '#2BA36B', '#A855F7', '#EC4899'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.4 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
  }
}

red.addEventListener('pointerdown', async () => {
  if (busy) return;
  presses++; click(); stats();
  if (step === 0) {
    // 1回目：警告（画面を暗くする。強い点滅はしない）
    step = 1; red.className = 'btn-red shake'; red.textContent = 'ダメ';
    document.body.classList.add('dark'); warn();
    say('押しましたね', 'もう一回押すと、逃げます。');
    if (laps % 2 === 1) setTimeout(() => { document.querySelector('.app').style.transform = 'rotate(180deg)'; say('逆さまにしました', 'それでも押しますか？'); }, 900);
  } else if (step === 1) {
    // 2回目：ボタンが逃げる。押せたら捕まえた
    step = 2; document.querySelector('.app').style.transform = ''; document.body.classList.remove('dark');
    red.className = 'btn-red small'; red.textContent = '捕まえて';
    say('逃げます', '捕まえて'); moveRandom(); escapeStart = performance.now();
    escapeTimer = setInterval(moveRandom, 650);
  } else if (step === 2) {
    // 捕まえた → 3・2・1 → 何も起きません → 最初に戻る
    busy = true; clearInterval(escapeTimer);
    const t = performance.now() - escapeStart; if (!best || t < best) best = Math.round(t);
    laps++; await store.save(); stats();
    countdown(() => {
      say('何も起きません', `あなたは${presses}回押しました`); confetti(); tada();
      setTimeout(reset, 2600);
    });
  }
});

$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; };

(async () => { const s = await store.load(); if (s) { presses = s.presses || 0; best = s.best || null; laps = s.laps || 0; } reset(); })();
</script>
</body>
</html>
