<html lang="ja">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

.qtag { background: var(--yellow); color: #111; border-radius: 10px; padding: 4px 9px; font-size: 18px; box-shadow: 3px 3px 0 #000; transform: rotate(-3deg); }
.q { font-size: clamp(22px, 6.4vw, 28px); line-height: 1.15; flex: 1; }
.timer { width: 46px; height: 46px; flex-shrink: 0; }
.timer circle { fill: none; stroke-width: 6; }
.timer .bg { stroke: #232833; } .timer .fg { stroke: var(--yellow); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.timer text { font-family: "Rubik", sans-serif; font-weight: 900; font-size: 20px; fill: var(--yellow); text-anchor: middle; dominant-baseline: central; }

.opt { cursor: pointer; }
.opt .glowc { fill: rgba(255,210,63,.18); stroke: var(--yellow); stroke-width: 3; stroke-dasharray: 7 6; }

<body>
<div class="app" id="app"></div>
<script>
/*
 * 空気読み戦線 どこに座る？
 * 電車・エレベーター・カフェなどの場面を、斜め上から見た立体風の絵（アイソメトリック）で再現し、
 * 3秒以内に A・B・C から自分の場所を選ぶ。選ぶと「あなた」が入口から歩いて行き、まわりの人の様子で結果が分かる。
 * 選ぶのを楽しむゲームで、性格や心の診断ではない。
 *
 * 場面の記号：. 空いた席（エレベーターは床） f 床 - 何もない D ドア・入口 T テーブル
 *   p 人 t 話している人 c せきをしている人 m 音もれ s 寝ている人 k 子ども e お年寄り w 作業中 y 食事中
 *   b 席に置いた荷物 g 大きなスーツケース  A/B/C 選べる場所
 */
const SHOW_CLASSROOM = true; // 教室編（コメントからの追加）を入れるか

const QUESTIONS = [
  { place: '電車', q: '電車 どこに座る？', cols: 8, map: 'A.tBt.Cc', best: 'A',
    why: { A: '端の席。まわりが静かで一番平和', B: '知らない2人の会話に挟まれる', C: 'せきをしている人の隣' } },
  { place: 'エレベーター', q: 'どこに立つ？', cols: 3, map: 'p.A.Bpp.CDDD', best: 'B',
    why: { A: '先客にくっつきすぎ', B: '全員と距離が均等。自然', C: '降りる人の出口をブロック' } },
  { place: 'カフェ', q: 'カフェ どこに座る？', cols: 4, map: 'pTAfffff.TBfkkCf', best: 'B',
    why: { A: '知らない人と同じテーブル', B: '空いたテーブル。落ち着ける', C: '子どもたちのすぐ横' } },
  { place: '待合室', q: '待合室 どこに座る？', cols: 5, map: 'p.A.pc.B..m.C..', best: 'C',
    why: { A: '先客の隣。まだ空いてるのに', B: 'せきをしている人の隣', C: '音もれの人から離れていて静か' } },
  { place: 'バス', q: 'バス どこに座る？', cols: 4, map: 'pf.A.fpBsf.Cef..', best: 'A',
    why: { A: '空いた2人席。ひとりでゆったり', B: '寝ている人の隣', C: 'お年寄りが座りたい前の席' } },
  { place: '図書館', q: '図書館 どこに座る？', cols: 4, map: 'wTwAfffBTyCTfTff', best: 'A',
    why: { A: '静かに作業する人たちの列', B: '食事中の人の向かい', C: '通路の真ん中' } },
  { place: '電車', q: '荷物がある電車', cols: 8, map: 'pbApgB.C', best: 'C',
    why: { A: '荷物を置かれた席の隣で窮屈', B: '大荷物の前で足元が狭い', C: '端の空いた席。広々' } },
  { place: 'エレベーター', q: '満員に近い', cols: 3, map: 'ppAp.pBC.DDD', best: 'A',
    why: { A: '奥の空いたすき間。邪魔にならない', B: 'ドアの真ん前', C: 'ボタンの前をふさぐ' } },
  { place: '映画館', q: '映画館 どこに座る？', cols: 6, map: 'C......Bpp......A.', best: 'A',
    why: { A: '前に人がいない見やすい席', B: '2人組のすぐ隣', C: '端すぎて画面が斜め' } },
  { place: '公園', q: '公園のベンチ', cols: 3, map: 'ApB.yC', best: 'C',
    why: { A: '知らない人と肩がぶつかる', B: '先客の真横', C: '別のベンチの端。気まずくない' } },
  { place: '電車', q: '寝ている人がいる', cols: 7, map: 'sA.Bp.C', best: 'C',
    why: { A: '寝ている人にもたれられる', B: '2人の間で窮屈', C: '端の席。誰にも挟まれない' } },
  { place: 'ラーメン屋', q: 'カウンター どこ？', cols: 7, map: 'yA.yB.C', best: 'C',
    why: { A: '先客の真横', B: '2人に挟まれる', C: '一席あけた端。食べやすい' } },
  { place: 'エレベーター', q: '2人だけ', cols: 3, map: '...pA.B.CDDD', best: 'C',
    why: { A: '先客の真横は近すぎる', B: '真ん中で落ち着かない', C: '対角の位置。自然な距離' } },
  { place: '待合室', q: '子どもが遊んでいる', cols: 5, map: 'kk.A..p..B..C.e', best: 'B',
    why: { A: '遊んでいる子どものすぐ横', B: '一人の人と一席あけて静か', C: 'お年寄りの隣。譲るなら別' } },
  { place: '電車', q: '音もれしている人', cols: 7, map: 'Am.B..C', best: 'C',
    why: { A: '音もれのすぐ隣', B: 'まだ音が聞こえる', C: '一番遠い端の席' } },
  { place: 'カフェ', q: '作業している人が多い', cols: 4, map: 'wTAfwT.fBTyfCT.f', best: 'A',
    why: { A: '作業する人どうし。集中できる', B: '食事中の人と相席', C: '入り口の真横で落ち着かない' } },
  { place: 'バス', q: '後ろの席', cols: 4, map: 'pp.p.A.BpC.p', best: 'A',
    why: { A: '空いた列。誰の隣でもない', B: '先客の真横', C: '人に挟まれる' } },
  { place: 'エレベーター', q: '大荷物の人', cols: 3, map: 'gpA.B.C..DDD', best: 'C',
    why: { A: '大荷物にぶつかる', B: '荷物の人が降りにくい', C: '手前の端。すぐ道をあけられる' } },
  { place: '電車', q: '優先席の近く', cols: 7, map: 'e.A.pBC', best: 'C',
    why: { A: 'お年寄りのすぐ近くで落ち着かない', B: '先客の真横', C: '端の席。まわりに余裕' } },
  { place: '会議室', q: '会議室 どこに座る？', cols: 4, map: 'pTpAffff...BCDff', best: 'A',
    why: { A: '先にいる人たちの近く。話しやすい', B: '一人だけ離れすぎ', C: '入り口をふさぐ' } },
];
// 教室編（コメントから追加した場面）
const CLASSROOM = [
  { place: '教室', q: '遅刻した教室 どこ？', cols: 5, map: 'pppppppAp.pBp.CDD...', best: 'A',
    why: { A: '後ろの空席。授業をじゃましない', B: '真ん中を横切ることになる', C: '一番前の席で目立つ' } },
  { place: '教室', q: 'テスト前の教室', cols: 5, map: 'w.w.wA.B.wC.w.w', best: 'A',
    why: { A: '勉強する人と一席あけた席', B: '真ん中で人の視界に入る', C: '集中している人の真横' } },
  { place: '教室', q: 'グループ活動', cols: 4, map: 'tTtAffffBT..kTkC', best: 'B',
    why: { A: '話している班に割り込む', B: '空いた班の席。すぐ混ざれる', C: 'にぎやかな班の横' } },
];
const ALL = SHOW_CLASSROOM ? [...QUESTIONS.slice(0, 3), CLASSROOM[0], ...QUESTIONS.slice(3), ...CLASSROOM.slice(1)] : QUESTIONS;
const TIME = 3000;
// 動画の撮影用（?video=1）：「あなた」が歩く速さを台本に合わせてゆっくりにする
const LEG = new URLSearchParams(location.search).get('video') ? 1000 : 400;

const ICON = {
  sound: '<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  mute: '<path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/>',
  ng: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  clock: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  edge: '<path d="M4 12h12M12 7l5 5-5 5M20 4v16"/>',
  noise: '<path d="M3 10v4h3l4 3V7L6 10zM15 9l6 6M21 9l-6 6"/>',
  people: '<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19a5 5 0 0 1 10 0M11 19a5 5 0 0 1 10 0"/>',
};
const svgi = (d) => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;

// ── 保存（ジサップの保存機能） ──
const store = {
  async load(k) { try { return window.Jisapp ? await window.Jisapp.loadData(k) : null; } catch { return null; } },
  async save(k, v) { try { if (window.Jisapp) await window.Jisapp.saveData(k, v); } catch {} },
};

// ── 効果音 ──
let actx = null, muted = false;
function tone(f, d = .08, type = 'sine', v = .14, delay = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const sfx = {
  tick: () => tone(880, .05, 'square', .05), tap: () => tone(660, .07, 'triangle', .18),
  step: k => tone(300 + (k % 2) * 60, .05, 'sine', .08),
  good: () => { tone(784, .1, 'triangle', .16); tone(1046, .18, 'triangle', .16, .1); },
  bad: () => { tone(260, .18, 'sawtooth', .06); tone(200, .22, 'sawtooth', .06, .16); },
};

// ════════════════════════════════════════════
//  斜め上から見た絵（アイソメトリック）
// ════════════════════════════════════════════
const S = 64;
const CX = S * 0.866, CY = S * 0.5;
const iso = (c, r) => ({ x: (c - r) * CX, y: (c + r) * CY });   // マス目（列・行）→ 画面の位置
const P = (pts) => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
const hash = k => (k * 2654435761) >>> 0;
const SHIRTS = ['#5b7fb8', '#7a9a5b', '#c46a46', '#7e5aa0', '#3f9a94', '#c0627d', '#8a7a5c', '#4b5a92'];
const HAIRS = ['#2b2420', '#4a3424', '#1c1c24', '#6b4a2e', '#3b2a22'];
const SKIN = '#f1c7a0';
/** 色を暗く・明るくする（#rrggbb を受け取り #rrggbb を返す。何度重ねてもよい） */
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const ch = v => Math.max(0, Math.min(255, Math.round(v * f))).toString(16).padStart(2, '0'); return `#${ch(n >> 16)}${ch(n >> 8 & 255)}${ch(n & 255)}`; };

/** 箱（席・テーブルなど）。c,r はマスの左上、w,d は幅と奥行き（マス）、h は高さ（px） */
function box(c, r, w, d, h, color, inset = .12) {
  const a = iso(c + inset, r + inset), b = iso(c + w - inset, r + inset), cc = iso(c + w - inset, r + d - inset), dd = iso(c + inset, r + d - inset);
  const up = p => ({ x: p.x, y: p.y - h });
  return `<polygon points="${P([dd, cc, up(cc), up(dd)])}" fill="${shade(color, .72)}"/>` +
    `<polygon points="${P([b, cc, up(cc), up(b)])}" fill="${shade(color, .86)}"/>` +
    `<polygon points="${P([up(a), up(b), up(cc), up(dd)])}" fill="${color}"/>`;
}

/** 立っている・座っている人（正面向きの立ち絵）。x,y は足もと */
function figure(x, y, kind, k, opts = {}) {
  const me = !!opts.me, seated = !!opts.seated, sc = kind === 'k' ? .72 : 1;
  const shirt = me ? '#ffd23f' : SHIRTS[hash(k) % SHIRTS.length], hair = kind === 'e' ? '#d4d0c8' : me ? '#2b2420' : HAIRS[hash(k + 7) % HAIRS.length];
  const legH = (seated ? 10 : 22) * sc, bodyH = 26 * sc, headR = 11 * sc, w = 22 * sc;
  const top = y - legH - bodyH;
  let s = `<g>`;
  s += `<ellipse cx="${x}" cy="${y}" rx="${14 * sc}" ry="${6 * sc}" fill="rgba(0,0,0,.28)"/>`;
  s += `<rect x="${x - w / 2 + 2}" y="${y - legH - 2}" width="${8 * sc}" height="${legH + 2}" rx="4" fill="#2f3542"/><rect x="${x + w / 2 - 2 - 8 * sc}" y="${y - legH - 2}" width="${8 * sc}" height="${legH + 2}" rx="4" fill="#2f3542"/>`;
  s += `<rect x="${x - w / 2}" y="${top}" width="${w}" height="${bodyH}" rx="${9 * sc}" fill="${shirt}"/>`;
  s += `<rect x="${x - w / 2}" y="${top + bodyH * .55}" width="${w}" height="${bodyH * .45}" rx="${6 * sc}" fill="${shade(shirt, .85)}"/>`;
  const hy = top - headR + 2;
  s += `<circle cx="${x}" cy="${hy}" r="${headR}" fill="${SKIN}"/>`;
  s += `<path d="M${x - headR} ${hy}a${headR} ${headR} 0 0 1 ${headR * 2} 0c-3-4-7-5-10-5-5 0-8 3-${headR * 2 - 10} 5z" fill="${hair}"/>`;
  if (kind === 's') s += `<path d="M${x - 6} ${hy + 2}q2.5 2 5 0M${x + 1} ${hy + 2}q2.5 2 5 0" stroke="#3a2a22" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  else s += `<circle cx="${x - 4}" cy="${hy + 2}" r="1.6" fill="#2a1f1a"/><circle cx="${x + 4}" cy="${hy + 2}" r="1.6" fill="#2a1f1a"/>`;
  if (kind === 'c') s += `<rect x="${x - 7}" y="${hy + 4}" width="14" height="7" rx="3" fill="#fff"/>`;
  if (kind === 'm') s += `<path d="M${x - headR - 1} ${hy}a${headR + 1} ${headR + 1} 0 0 1 ${headR * 2 + 2} 0" stroke="#111" stroke-width="3" fill="none"/><rect x="${x - headR - 4}" y="${hy - 3}" width="6" height="9" rx="2" fill="#111"/><rect x="${x + headR - 2}" y="${hy - 3}" width="6" height="9" rx="2" fill="#111"/>`;
  if (kind === 'e') s += `<path d="M${x + 15} ${y}l-2 -34q0-4 4-4" stroke="#8a6a48" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (kind === 'w') s += `<rect x="${x - 13}" y="${top + 8}" width="26" height="15" rx="2" fill="#aab3bd"/><rect x="${x - 11}" y="${top + 10}" width="22" height="11" rx="1" fill="#bfe3ff"/>`;
  if (kind === 'y') s += `<path d="M${x - 12} ${top + 12}h24a12 8 0 0 1-24 0z" fill="#fff" stroke="#e05a3b" stroke-width="2"/>`;
  if (me) s += `<g class="react"><rect x="${x - 24}" y="${hy - headR - 26}" width="48" height="18" rx="9" fill="#ffd23f" stroke="#000" stroke-width="2.5"/><text x="${x}" y="${hy - headR - 17}" font-size="10" font-weight="900" fill="#111" text-anchor="middle" dominant-baseline="central">あなた</text></g>`;
  return s + '</g>';
}

/** 人の様子（話している・せき・音もれ・寝ている・遊んでいる） */
function statusMark(x, y, kind, k) {
  if (kind === 't') return `<g class="talk" style="animation-delay:${(k % 2) * .55}s"><path d="M${x - 18} ${y - 28}h36a8 8 0 0 1 8 8v6a8 8 0 0 1-8 8h-20l-8 8v-8h-8a8 8 0 0 1-8-8v-6a8 8 0 0 1 8-8z" fill="#fff" stroke="#000" stroke-width="2.5"/><circle cx="${x - 9}" cy="${y - 17}" r="2.6" fill="#000"/><circle cx="${x}" cy="${y - 17}" r="2.6" fill="#000"/><circle cx="${x + 9}" cy="${y - 17}" r="2.6" fill="#000"/></g>`;
  if (kind === 'c') return `<g class="bob"><text x="${x + 12}" y="${y - 10}" font-size="12" font-weight="900" fill="#c9ced8" stroke="#000" stroke-width="3" paint-order="stroke">ゴホッ</text></g>`;
  if (kind === 'm') return `<g class="bob"><path d="M${x + 14} ${y - 2}v-16l10-3v14" stroke="#38d6f5" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="${x + 12}" cy="${y - 2}" r="3" fill="#38d6f5"/><circle cx="${x + 22}" cy="${y - 5}" r="3" fill="#38d6f5"/></g>`;
  if (kind === 's') return `<g class="bob"><text x="${x + 10}" y="${y - 8}" font-size="15" font-weight="900" fill="#8fb3ff">Z</text><text x="${x + 21}" y="${y - 19}" font-size="11" font-weight="900" fill="#8fb3ff">z</text></g>`;
  if (kind === 'k') return `<g class="bob"><circle cx="${x + 16}" cy="${y - 4}" r="6" fill="#ffd23f" stroke="#000" stroke-width="2"/></g>`;
  return '';
}

/** 場所の札（緑の「入口」「ドア」など） */
function sign(x, y, text, color = '#1f8a4c') {
  const w = text.length * 13 + 16;
  return `<g><rect x="${x - w / 2}" y="${y - 13}" width="${w}" height="26" rx="5" fill="${color}" stroke="#0b0d12" stroke-width="2.5"/><text x="${x}" y="${y + 1}" font-size="12" font-weight="900" fill="#fff" text-anchor="middle" dominant-baseline="central">${text}</text></g>`;
}

const isPerson = ch => 'ptcmskewy'.includes(ch);
const THEME = {
  '電車': { floor: ['#8d8a83', '#99968e'], wall: '#d9d4c7', seat: '#3f8f6b' },
  'エレベーター': { floor: ['#9aa1a8', '#a8aeb4'], wall: '#b9c0c7', seat: '#3f8f6b' },
  'カフェ': { floor: ['#b07d55', '#bd8a61'], wall: '#e8d8bf', seat: '#4b6f8a' },
  '待合室': { floor: ['#c9c4ba', '#d4cfc5'], wall: '#e7e3d9', seat: '#4f7fa8' },
  'バス': { floor: ['#7f8790', '#8b939b'], wall: '#d6dbe0', seat: '#3f6f9f' },
  '図書館': { floor: ['#6f8a6a', '#7b9675'], wall: '#e4dccb', seat: '#8a5a3c' },
  '映画館': { floor: ['#3a2b40', '#43334a'], wall: '#2a2030', seat: '#b3323b' },
  '公園': { floor: ['#77a65d', '#82b067'], wall: null, seat: '#a8723f' },
  'ラーメン屋': { floor: ['#5a4030', '#664a38'], wall: '#7a4e33', seat: '#d14b2f' },
  '会議室': { floor: ['#8e98a3', '#99a3ad'], wall: '#dfe4e9', seat: '#3d4a5a' },
  '教室': { floor: ['#b48a5c', '#c09668'], wall: '#efe7d6', seat: '#c9a06a' },
};

/** 1列の場面（電車・ラーメン屋）は、向かいの席や通路を足して部屋にする */
function layoutOf(Q) {
  const cells = Q.map.split(''), cols = Q.cols, rows = Math.ceil(cells.length / cols);
  if (rows > 1) return { cells, cols, rows };
  if (Q.place === 'ラーメン屋') return { cells: [...'K'.repeat(cols), ...cells, ...'f'.repeat(cols - 1), 'D'], cols, rows: 3 };
  // 電車：奥の壁ぎわが問題の席、まん中が通路、いちばん手前が向かいの席（飾り）
  const opp = Array.from({ length: cols }, (_, k) => hash(k + cols * 5) % 3 === 0 ? 'O' : 'o');
  return { cells: [...cells, ...'f'.repeat(cols - 1), 'D', ...opp], cols, rows: 3 };
}

function drawScene(Q) {
  const { cells, cols, rows } = layoutOf(Q), th = THEME[Q.place] || THEME['待合室'];
  const elevator = Q.place === 'エレベーター', WALL = 70;
  const center = (c, r) => iso(c + .5, r + .5);
  let floor = '', walls = '', items = [], pos = {}, entry = null;

  // 床（市松）と、床の厚み
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) floor += `<polygon points="${P([iso(c, r), iso(c + 1, r), iso(c + 1, r + 1), iso(c, r + 1)])}" fill="${th.floor[(r + c) % 2]}"/>`;
  const down = p => ({ x: p.x, y: p.y + 10 });
  floor += `<polygon points="${P([iso(0, rows), iso(cols, rows), down(iso(cols, rows)), down(iso(0, rows))])}" fill="${shade(th.floor[0], .6)}"/>`;
  floor += `<polygon points="${P([iso(cols, 0), iso(cols, rows), down(iso(cols, rows)), down(iso(cols, 0))])}" fill="${shade(th.floor[0], .75)}"/>`;
  // 奥の壁（左奥と右奥）と、壁の飾り（窓・黒板・スクリーン・品書き）
  if (th.wall) {
    const up = p => ({ x: p.x, y: p.y - WALL });
    walls += `<polygon points="${P([iso(0, 0), iso(0, rows), up(iso(0, rows)), up(iso(0, 0))])}" fill="${shade(th.wall, .8)}"/>`;
    walls += `<polygon points="${P([iso(0, 0), iso(cols, 0), up(iso(cols, 0)), up(iso(0, 0))])}" fill="${th.wall}"/>`;
    const onBack = (c0, c1, h0, h1, color) => `<polygon points="${P([{ x: iso(c0, 0).x, y: iso(c0, 0).y - h0 }, { x: iso(c1, 0).x, y: iso(c1, 0).y - h0 }, { x: iso(c1, 0).x, y: iso(c1, 0).y - h1 }, { x: iso(c0, 0).x, y: iso(c0, 0).y - h1 }])}" fill="${color}"/>`;
    if (['電車', 'バス'].includes(Q.place)) for (let c = 0; c < cols; c += 2) walls += onBack(c + .2, Math.min(cols, c + 1.8), 34, 62, '#9fd3e6');
    if (Q.place === '教室') walls += onBack(.6, cols - .6, 24, 62, '#2f5a3f');
    if (Q.place === '映画館') walls += onBack(.3, cols - .3, 16, 66, '#e9e7f2');
    if (Q.place === 'ラーメン屋') for (let c = 0; c < cols; c++) walls += onBack(c + .25, c + .75, 30, 64, '#f4e6c8');
    if (Q.place === 'カフェ' || Q.place === '図書館') for (let c = 0; c < cols; c += 2) walls += onBack(c + .3, c + 1.5, 26, 60, Q.place === '図書館' ? '#7a5a3c' : '#9fd3e6');
    if (elevator) walls += onBack(cols - .6, cols - .3, 22, 48, '#5d656d');
  }

  cells.forEach((ch, k) => {
    const c = k % cols, r = Math.floor(k / cols), ctr = center(c, r), z = c + r;
    const seat = () => {
      if (Q.place === '教室') return box(c + .1, r + .1, .8, .8, 22, th.seat); // 机
      if (Q.place === '公園') return box(c, r + .25, 1, .5, 14, th.seat, .04);
      if (Q.place === '電車') return box(c, r, 1, .8, 16, th.seat, .02) + box(c, r, 1, .2, 34, shade(th.seat, .85), .02);
      return box(c + .15, r + .15, .7, .7, 16, th.seat) + box(c + .15, r + .15, .7, .16, 32, shade(th.seat, .85), 0);
    };
    if (ch === 'f' || ch === '-') return;
    if (ch === 'D') { if (!entry) entry = { c: c + .5, r: r + .5 }; items.push({ z: z - .5, s: `<polygon points="${P([iso(c, r), iso(c + 1, r), iso(c + 1, r + 1), iso(c, r + 1)])}" fill="#f2c230" opacity=".35"/>` }); return; }
    if (ch === 'T') { items.push({ z, s: box(c + .05, r + .05, .9, .9, 26, Q.place === '会議室' ? '#a7b2bd' : '#a9774a') }); return; }
    if (ch === 'K') { items.push({ z, s: box(c, r + .2, 1, .8, 30, '#c98f5a', 0) }); return; }
    if (ch === 'o' || ch === 'O') { items.push({ z, s: box(c, r + .2, 1, .8, 16, th.seat, .02) }); if (ch === 'O') items.push({ z: z + .1, s: figure(ctr.x, ctr.y - 10, 'p', k + 50, { seated: true }) }); return; }
    const hasSeat = !elevator && ch !== 'g';
    if (hasSeat) items.push({ z, s: seat() });
    if (ch === 'b') items.push({ z: z + .1, s: box(c + .3, r + .3, .4, .4, 30, '#a06a3c', 0) });
    if (ch === 'g') items.push({ z: z + .1, s: box(c + .25, r + .3, .5, .4, 44, '#4f78a8', 0) });
    const lift = hasSeat ? 12 : 0;
    if (isPerson(ch)) items.push({ z: z + .1, s: figure(ctr.x, ctr.y - lift, ch, k, { seated: hasSeat }) + statusMark(ctr.x, ctr.y - lift - 64, ch, k) });
    if ('ABC'.includes(ch)) pos[ch] = { c: c + .5, r: r + .5, x: ctr.x, y: ctr.y, seatLift: lift, z };
  });
  if (!entry) entry = { c: cols - .5, r: rows + .6 };

  // 札（入口・ドア・黒板など）
  const e = iso(entry.c, entry.r);
  let signs = sign(e.x + 6, e.y + 26, ['電車', 'エレベーター', 'バス'].includes(Q.place) ? 'ドア' : '入口');
  if (Q.place === '教室') signs += sign(iso(cols / 2, 0).x, iso(cols / 2, 0).y - 82, '黒板', '#2f5a3f');
  if (Q.place === '映画館') signs += sign(iso(cols / 2, 0).x, iso(cols / 2, 0).y - 82, 'スクリーン', '#5a4a7a');
  if (elevator) signs += sign(iso(cols - .45, 0).x + 4, iso(cols - .45, 0).y - 62, 'ボタン', '#555d66');

  // 選べる場所（床の輪と、上に浮かぶピン）
  Object.entries(pos).forEach(([L, p]) => {
    const pinY = p.y - p.seatLift - 92;
    items.push({ z: 999, s: `<g class="opt" data-opt="${L}"><ellipse class="glowc" cx="${p.x}" cy="${p.y}" rx="${CX * .62}" ry="${CY * .62}"/><g class="pin"><path d="M${p.x - 10} ${pinY + 18}L${p.x} ${pinY + 34}L${p.x + 10} ${pinY + 18}z"/><circle cx="${p.x}" cy="${pinY}" r="21"/><text x="${p.x}" y="${pinY + 1}" font-size="24">${L}</text></g><rect x="${p.x - 34}" y="${pinY - 24}" width="68" height="${p.y - pinY + 40}" fill="transparent"/></g>` });
  });
  items.sort((a, b) => a.z - b.z);

  // 全体の大きさ
  const minX = iso(0, rows).x - 14, maxX = iso(cols, 0).x + 14;
  const minY = iso(0, 0).y - (th.wall ? WALL : 0) - 70, maxY = iso(cols, rows).y + 44;
  const svg = `<svg viewBox="${minX} ${minY} ${maxX - minX} ${maxY - minY}" preserveAspectRatio="xMidYMid meet">${floor}${walls}${items.map(i => i.s).join('')}${signs}<g id="actors"></g></svg>`;
  return { svg, pos, entry };
}

// ════════════════════════════════════════════
//  遊び
// ════════════════════════════════════════════
const app = document.getElementById('app');
let state = { i: 0, score: 0, answers: [], best: null }, timers = [], scene = null, picked = false;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const clearAll = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const soundBtn = () => `<button class="sq" id="mute" aria-label="音">${svgi(muted ? ICON.mute : ICON.sound)}</button>`;
function bindMute() { const m = document.getElementById('mute'); if (m) m.onclick = () => { muted = !muted; m.innerHTML = svgi(muted ? ICON.mute : ICON.sound); }; }

function cover() {
  clearAll();
  const bg = drawScene(ALL[0]).svg;
  app.innerHTML = `
    <div class="cover">
      <div class="scene-bg">${bg}</div>
      <div style="position:absolute;right:0;top:0">${soundBtn()}</div>
      <div class="logo"><span class="l1">空気読み</span><span class="l2">戦線</span><span class="l3" data-t="どこに座る？">どこに座る？</span></div>
      <div class="tagline">電車・エレベーター・カフェの空気を読み切れ</div>
      <div class="spacer"></div>
      <div class="rules">
        <div class="rule"><span style="color:#ff4b3e">${svgi(ICON.ban)}</span>知らない人の隣はなるべく避ける</div>
        <div class="rule"><span style="color:#22c55e">${svgi(ICON.edge)}</span>端は片側が壁で安心</div>
        <div class="rule"><span style="color:#38d6f5">${svgi(ICON.noise)}</span>会話・音もれの近くは落ち着かない</div>
        <div class="rule"><span style="color:#ffd23f">${svgi(ICON.people)}</span>後から来る人のことも考える</div>
      </div>
      <div class="badge-red">全${ALL.length}問　迷ったら気まずい</div>
      ${state.best !== null ? `<div class="note">自己ベスト ${state.best} / ${ALL.length}</div>` : ''}
      <button class="btn big en" id="go">START</button>
      <div class="note">選ぶのを楽しむゲームです。性格や心の診断ではありません。</div>
    </div>`;
  app.querySelectorAll('.scene-bg .opt').forEach(o => o.remove());
  bindMute();
  document.getElementById('go').onclick = () => { sfx.tap(); state.i = 0; state.score = 0; state.answers = []; question(); };
}

function hud(Q) {
  const n = state.i + 1;
  return `<div class="stage-name en">STAGE ${Math.ceil(n / 5)}-${(state.i % 5) + 1}　<b>${esc(Q.place)}</b></div>
    <div class="hud"><span class="coin en">${state.score}</span><span class="count en">${n} / ${ALL.length}</span>${soundBtn()}</div>
    <div class="progress"><i style="width:${(state.i / ALL.length) * 100}%"></i></div>`;
}

function question() {
  clearAll(); picked = false;
  const Q = ALL[state.i];
  scene = drawScene(Q);
  app.innerHTML = `${hud(Q)}
    <div class="qrow"><span class="qtag en">Q${state.i + 1}</span><span class="q dela">${esc(Q.q)}</span>
      <svg class="timer" viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="19"/><circle class="fg" id="tfg" cx="23" cy="23" r="19" stroke-dasharray="119.4" stroke-dashoffset="0"/><text x="23" y="24" id="ttx">3</text></svg></div>
    <div class="stage" id="stage">${scene.svg}</div>
    <div class="panel" id="panel"></div>`;
  bindMute();
  const opts = [...app.querySelectorAll('.opt')].sort((a, b) => a.dataset.opt.localeCompare(b.dataset.opt));
  opts.forEach(o => o.addEventListener('pointerdown', () => choose(o.dataset.opt)));
  let g = 0; const glow = () => { opts.forEach(o => o.classList.remove('glow')); opts[g++ % opts.length].classList.add('glow'); };
  glow(); timers.push(setInterval(glow, 280));
  const fg = document.getElementById('tfg'), tx = document.getElementById('ttx'), t0 = performance.now();
  sfx.tick();
  timers.push(setInterval(() => {
    const left = Math.max(0, TIME - (performance.now() - t0));
    fg.setAttribute('stroke-dashoffset', String(119.4 * (1 - left / TIME)));
    const n = Math.ceil(left / 1000); if (n > 0 && tx.textContent !== String(n)) { tx.textContent = n; sfx.tick(); }
    if (left <= 0) choose(null);
  }, 50));
}

function choose(opt) {
  if (picked) return; picked = true; clearAll();
  const Q = ALL[state.i], ok = opt === Q.best, svgEl = app.querySelector('#stage svg'), actors = svgEl.querySelector('#actors');
  app.querySelectorAll('.opt').forEach(o => { o.classList.remove('glow'); if (o.dataset.opt !== opt) o.classList.add('dim'); });
  document.getElementById('ttx').textContent = '';
  state.answers.push(ok); if (ok) state.score++;
  const panel = document.getElementById('panel');
  if (!opt) {
    sfx.bad(); showBest(Q);
    panel.innerHTML = `<div class="verdict bad dela">${svgi(ICON.clock)}時間切れ</div><div class="why">一番平和は <b>${Q.best}</b>：${esc(Q.why[Q.best])}</div>${nextBtn()}`;
    bindNext(); return;
  }
  sfx.tap();
  panel.innerHTML = `<div class="verdict dela">${opt} を選ぶと……</div>`;
  // 「あなた」が入口から歩いてきて、その場所へ（マス目の上を、行→列の順に進む）
  const p = scene.pos[opt], e = scene.entry;
  const way = [e, { c: e.c, r: p.r }, { c: p.c, r: p.r }].map(w => iso(w.c, w.r));
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'walker');
  g.innerHTML = figure(0, 0, 'p', 0, { me: true });
  g.style.transform = `translate(${way[0].x}px, ${way[0].y}px)`;
  actors.appendChild(g);
  let st = 0; timers.push(setInterval(() => sfx.step(st++), 140));
  way.slice(1).forEach((w, k) => later(() => { g.style.transform = `translate(${w.x}px, ${w.y}px)`; }, 30 + k * LEG));
  later(() => {
    clearAll();
    g.style.transition = 'none';
    g.style.transform = `translate(${p.x}px, ${p.y - p.seatLift}px)`;
    g.innerHTML = figure(0, 0, 'p', 0, { me: true, seated: p.seatLift > 0 }) + reaction(ok);
    if (!ok) svgEl.classList.add('fast');
    ok ? sfx.good() : sfx.bad();
    showBest(Q);
    panel.innerHTML = `
      <div class="verdict ${ok ? 'good' : 'bad'} dela">${svgi(ok ? ICON.ok : ICON.ng)}${ok ? '正解！ +1' : esc(Q.why[opt])}</div>
      <div class="why">${ok ? esc(Q.why[opt]) : `一番平和は <b>${Q.best}</b>：${esc(Q.why[Q.best])}`}</div>
      ${nextBtn()}`;
    bindNext();
  }, 30 + (way.length - 1) * LEG + 100);
}

/** 座ったあとの気持ち */
function reaction(ok) {
  const t = ok ? 'ちょうどいい' : '気まずい…', col = ok ? '#22c55e' : '#ff4b3e';
  const mark = ok ? `<path d="M18 -86l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3z" fill="#ffd23f"/>` : `<path d="M17 -76c0-7 6-13 6-13s6 6 6 13a6 6 0 0 1-12 0z" fill="#7cc4e4"/>`;
  return `<g class="react">${mark}<rect x="-50" y="-118" width="100" height="26" rx="13" fill="#0b0d12" stroke="${col}" stroke-width="3"/><text x="0" y="-105" font-size="13" font-weight="900" fill="${col}" text-anchor="middle" dominant-baseline="central">${t}</text></g>`;
}

function showBest(Q) { const el = app.querySelector(`.opt[data-opt="${Q.best}"]`); if (el) { el.classList.remove('dim'); el.classList.add('best'); } }
function nextBtn() { return `<button class="btn" id="next">${state.i + 1 < ALL.length ? '次の問題' : '結果を見る'}</button>`; }
function bindNext() { document.getElementById('next').onclick = () => { sfx.tap(); state.i++; state.i < ALL.length ? question() : finish(); }; }

function typeOf(score, total) {
  const r = score / total;
  if (r >= .85) return ['空気読み名人', 'どこでも自然な距離をとれる'];
  if (r >= .6) return ['ほどよい距離感', 'たいていの場面で気まずくならない'];
  if (r >= .35) return ['のびのびタイプ', '自分のペースを大事にする'];
  return ['大胆タイプ', 'どこでも気にせず座れる強さがある'];
}

async function finish() {
  clearAll();
  const total = ALL.length, [type, desc] = typeOf(state.score, total);
  if (state.best === null || state.score > state.best) { state.best = state.score; await store.save('best', state.best); }
  sfx.good();
  app.innerHTML = `
    <div class="stage-name en">RESULT</div>
    <div class="hud"><span class="coin en">${state.score}</span><span class="count en">${total} / ${total}</span>${soundBtn()}</div>
    <div class="progress"><i style="width:100%"></i></div>
    <div class="result">
      <div class="k">あなたの距離感タイプ</div>
      <div class="type">${type}</div>
      <div class="why">${desc}</div>
      <div class="score">${state.score}<small> / ${total}</small></div>
      <div class="grid-dots">${state.answers.map(a => `<i class="${a ? 'ok' : 'ng'}"></i>`).join('')}</div>
      <div class="why" style="color:var(--sub)">自己ベスト ${state.best} / ${total}</div>
      <div style="flex:1"></div>
      <button class="btn" id="copy">結果をコピー</button>
      <button class="btn dark" id="again">もう一度あそぶ</button>
      <div class="note">選ぶのを楽しむゲームです。性格や心の診断ではありません。</div>
    </div>`;
  bindMute();
  document.getElementById('again').onclick = () => { sfx.tap(); cover(); };
  document.getElementById('copy').onclick = async e => { try { await navigator.clipboard.writeText(`空気読み戦線 どこに座る？ ${state.score}/${total}「${type}」`); e.currentTarget.textContent = 'コピーしました'; } catch {} };
}

if (LEG > 400) document.body.classList.add('video');
(async () => { state.best = await store.load('best'); cover(); })();
</script>
</body>
</html>
